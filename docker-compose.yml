services:
  abstimmungstool:
    build: .
    container_name: abstimmungstool
    restart: unless-stopped
    ports:
      # Nur auf localhost: Der Cloudflare-Tunnel (cloudflared auf dem Host) verbindet sich über 127.0.0.1. Auf allen
      # Schnittstellen wäre das Tool über die öffentliche IPv6 des Servers am Tunnel vorbei erreichbar - dann ließe sich
      # X-Forwarded-For frei setzen und jede IP-Drosselung umgehen (suite-kit docs/KONVENTIONEN.md, "Betrieb").
      # Ports der Suite: 3005 rsvp-app, 3006 Abstimmungstool, 3007 Seating, 3008 Zeitplan, 3009 Schichten.
      - "127.0.0.1:3006:3000"
    volumes:
      # Speichert die SQLite-Datenbank sicher außerhalb des Containers, damit
      # Abstimmungen bei Updates nicht verloren gehen.
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - DATABASE_URL=file:/app/data/prod.db
      - TZ=Europe/Berlin
    networks:
      - default
      # Uptime Kuma (eigener Container im Netz proxy_net) prüft die Erreichbarkeit intern über http://abstimmungstool:3000 -
      # der Port oben ist nur noch auf localhost offen.
      - proxy_net

networks:
  proxy_net:
    external: true
